 #b7e2cc}.status.error{display:block;color:#b42318;background:#fff8f7;border:1px solid #f1b8b2}.filters{background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px;margin:10px 0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}.filter label{font-size:9px;font-weight:800;color:#53677e;display:block;margin-bottom:4px;text-transform:uppercase}.filter select{width:100%;height:32px;border:1px solid #d2ddea;border-radius:7px;background:#fff;color:#173452;padding:0 7px}.filter-actions{display:flex;gap:8px;align-items:end}.filter-actions button{height:32px}.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chart-card{background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px;min-width:0}.chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}.chart-title{font-weight:800;font-size:12px}.chart-unit{font-size:10px;color:#73839a;margin-top:3px}.chart-years{font-size:9px;color:#6881a0}.chart-box{height:205px;position:relative}.detail{margin-top:10px;background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.detail-head h3{margin:0;font-size:14px}.detail-head small{color:#73839a}.detail-actions{display:flex;gap:8px}.search{width:270px;border:1px solid #d2ddea;border-radius:7px;padding:8px 10px}.table-wrap{max-height:430px;overflow:auto;border:1px solid #e6ebf2;border-radius:7px}.table-wrap table{border-collapse:separate;border-spacing:0;min-width:2100px;width:max-content;font-size:10px}.table-wrap th,.table-wrap td{padding:7px 8px;border-bottom:1px solid #edf1f5;border-right:1px solid #edf1f5;white-space:nowrap;background:#fff}.table-wrap th{position:sticky;top:0;background:#f7f9fc;z-index:5;color:#526079}.pager{display:flex;justify-content:flex-end;align-items:center;gap:7px;padding-top:8px}.pager button{padding:5px 10px;border:1px solid #d2ddea;background:#ff .multi{position:relative}.multi-btn{width:100%;height:32px;border:1px solid #d2ddea;border-radius:7px;background:#fff;color:#173452;padding:0 8px;text-align:left;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.multi-menu{display:none;position:absolute;left:0;right:0;top:35px;background:#fff;border:1px solid #cfd9e6;border-radius:7px;box-shadow:0 8px 20px rgba(20,43,74,.12);padding:7px;z-index:50}.multi.open .multi-menu{display:block}.multi-search{width:100%;height:28px;border:1px solid #d2ddea;border-radius:5px;padding:0 7px;margin-bottom:6px;font-size:11px}.multi-tools{display:flex;gap:5px;margin-bottom:5px}.multi-tools button{border:1px solid #d2ddea;background:#f7f9fc;border-radius:5px;padding:4px 7px;font-size:10px;cursor:pointer}.multi-checks{max-height:180px;overflow:auto}.multi-check{display:flex;align-items:center;gap:6px;padding:4px 3px;font-size:11px;white-space:nowrap}.multi-check input{margin:0}.multi-empty{padding:8px;color:#7b8798;font-size:10px}.multi-filter{min-width:0}

<body>
<div class="app">

<main>
<header class="header">
 <div class="brand"><h1>DASHBOARD AHI UIT JBB</h1><p>Trend Inspection – PMT</p></div>
 <div class="actions"><div class="date">Data Terakhir<b id="lastDate">Memuat...</b></div><button class="btn" id="resetBtn">↻ Reset Filter</button></div>
</header>
<div id="status" class="status"></div>
<section class="filters">
 <div class="filter multi-filter"><label>Unit Induk</label><div class="multi" id="unit"></div></div>
 <div class="filter multi-filter"><label>UPT</label><div class="multi" id="upt"></div></div>

 <div class="filter multi-filter"><label>Bay</label><div class="multi" id="bay"></div></div>
 <div class="filter multi-filter"><label>PMT</label><div class="multi" id="pmt"></div></div>

 <div class="detail-head"><div><h3>Detail Pengujian PMT</h3><small id="count">Menampilkan 0 data</small></div><div class="detail-actions"><input class="search" id="search" placeholder="Search GI / Bay / Nama Aset..."><button class="btn" id="exportBtn">⇩ Export CSV</button></div></div>
 <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
 <div class="pager"><span class="muted" id="pageInfo"></span><button id="prev">‹</button><button id="next">›</button></div>
</section>

<script>
const SHEET_CSV='https://docs.google.com/spreadsheets/d/1P5kQZooTtNcgjEkMET-pqqmSkJQ9XWnnBxqIf3KAZXw/export?format=csv&gid=1202083824';
const PAGE_SIZE=10;let raw=[],filtered=[],page=1,charts=[];
const $=id=>document.getElementById(id);
function norm(s){return String(s??'').normalize('NFKC').replace(/\u00a0/g,' ').replace(/[–—−]/g,'-').replace(/\s+/g,' ').trim().toLowerCase()}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false,delim=(t.split(/\r?\n/).find(Boolean)||'').split(';').length>(t.split(/\r?\n/).find(Boolean)||'').split(',').length?';':',';for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===delim&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}if(!rows.length)return[];let headers=rows.shift().map(x=>x.trim());return rows.map(a=>Object.fromEntries(headers.map((h,i)=>[h,(a[i]??'').trim()])))}
function headers(){return Object.keys(raw[0]||{})}
function findCol(candidates){let hs=headers();for(const c of candidates){let n=norm(c);let exact=hs.find(h=>norm(h)===n);if(exact)return exact}for(const c of candidates){let n=norm(c);let hit=hs.find(h=>norm(h).includes(n));if(hit)return hit}return ''}
function findAll(patterns){let hs=headers();return hs.filter(h=>patterns.some(p=>norm(h).includes(norm(p))))}
const C={unit:['unit induk'],upt:['upt','unit pelaksana'],ultg:['ultg'],gi:['gardu induk'],bay:['bay'],pmt:['pmt','nama pmt','circuit breaker','cb'],phasa:['phasa'],merk:['merk','merek'],type:['type','tipe'],date:['tanggal pemeliharaan terakhir','tanggal pemeliharaan','tanggal uji'],irAB:['hasil uji tahanan isolasi atas - bawah','hasil uji tahanan isolasi atas-bawah'],irAG:['hasil uji tahanan isolasi atas - ground','hasil uji tahanan isolasi atas-ground'],irBG:['hasil uji tahanan isolasi bawah - ground','hasil uji tahanan isolasi bawah-ground'],contactR:['pengujian tahanan kontak (mikro ohm) r'],contactS:['pengujian tahanan kontak (mikro ohm) s'],contactT:['pengujian tahanan kontak (mikro ohm) t'],closingR:['pengujian closing time (ms) r'],closingS:['pengujian closing time (ms) s'],closingT:['pengujian closing time (ms) t'],openingR:['pengujian opening time (ms) r'],openingS:['pengujian opening time (ms) s'],openingT:['pengujian opening time (ms) t'],purity:['pengujian sf6 purity'],dew:['pengujian sf6 dew point'],so2:['pengujian sf6 so2'],serial:['nomor seri','serial'],tech:['techident number','techidentno'],name:['bay']};
let COL={};
function resolveCols(){for(const k in C)COL[k]=findCol(C[k]);}
function val(r,k){let h=COL[k];return h?r[h]:''}
function num(v){let s=String(v??'').trim();if(!s)return null;s=s.replace(/\s/g,'');if(s.includes('.')&&s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(s.includes(',')&&!s.includes('.')){s=s.replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}let m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function year(v){let s=String(v||'');let m=s.match(/(20\d{2})/);return m?+m[1]:null}
function uniqueBy(rows,k){return [...new Set(rows.map(r=>val(r,k)).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'id'))}
function fill(id,values,keep){let s=$(id),old=keep??s.value;s.innerHTML='<option value="">Semua</option>'+values.map(v=>`<option>${escapeHtml(v)}</option>`).join('');if(values.includes(old))s.value=old}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function baseFiltered(stop){let f=raw.slice();const ids=['unit','upt','ultg','gi','bay','phasa','merk','type'];for(const id of ids){if(id===stop)break;let v=$(id).value;if(v)f=f.filter(r=>val(r,id=== 'type'?'type':id)===v)}return f}
function refreshFilters(changed){return;}
function multiLabel(k){
  const b=$(k), n=multiSel[k].size;
  const btn=b?.querySelector('.multi-btn');
  if(btn) btn.textContent=n?`${n} dipilih`:'Semua';
}
function buildMulti(k){
  const b=$(k); if(!b)return;
  b.className='multi';
  b.innerHTML=`<button type="button" class="multi-btn">Semua</button>
  <div class="multi-menu">
    <input class="multi-search" placeholder="Ketik untuk mencari...">
    <div class="multi-tools"><button type="button" data-all>Pilih Semua</button><button type="button" data-clear>Hapus</button></div>
    <div class="multi-checks"></div>
  </div>`;
  const menu=b.querySelector('.multi-menu'), search=b.querySelector('.multi-search'), checks=b.querySelector('.multi-checks');
  function draw(){
    const q=norm(search.value);
    const vals=multiValues(k).filter(v=>!q||norm(v).includes(q));
    checks.innerHTML=vals.length?vals.map(v=>`<label class="multi-check"><input type="checkbox" value="${escapeHtml(v)}" ${multiSel[k].has(v)?'checked':''}> <span>${escapeHtml(v)}</span></label>`).join(''):'<div class="multi-empty">Tidak ada data</div>';
    checks.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?multiSel[k].add(i.value):multiSel[k].delete(i.value);multiLabel(k)});
  }
  b.querySelector('.multi-btn').onclick=e=>{e.stopPropagation();document.querySelectorAll('.multi.open').forEach(x=>x!==b&&x.classList.remove('open'));b.classList.toggle('open');if(b.classList.contains('open')){draw();search.focus()}};
  search.oninput=draw;
  b.querySelector('[data-all]').onclick=()=>{multiValues(k).forEach(v=>multiSel[k].add(v));draw();multiLabel(k)};
  b.querySelector('[data-clear]').onclick=()=>{multiSel[k].clear();draw();multiLabel(k)};
  draw();
}
document.addEventListener('click',e=>{if(!e.target.closest('.multi'))document.querySelectorAll('.multi.open').forEach(x=>x.classList.remove('open'))});
function applyMulti(){
  let f=raw.slice();
  for(const k of multiKeys){if(multiSel[k].size)f=f.filter(r=>multiSel[k].has(val(r,k)))}
  const fy=+$('fromYear').value,ty=+$('toYear').value;
  if(fy)f=f.filter(r=>(year(val(r,'date'))||0)>=fy);
  if(ty)f=f.filter(r=>(year(val(r,'date'))||0)<=ty);
  filtered=f;page=1;render();
}

function populateAll(){multiKeys.forEach(buildMulti);updateYears();}
$('applyFilterBtn').onclick=applyMulti;
['fromYear','toYear'].forEach(id=>$(id).addEventListener('change',applyMulti));apply()}));['fromYear','toYear'].forEach(id=>$(id).addEventListener('change',apply));$('search').addEventListener('input',()=>{page=1;detailRows()});$('prev').onclick=()=>{if(page>1){page--;detailRows()}};$('next').onclick=()=>{page++;detailRows()};$('resetBtn').onclick=()=>{multiKeys.forEach(k=>{multiSel[k].clear();multiLabel(k);buildMulti(k)});updateYears();applyMulti()};$('exportBtn').onclick=exportCSV;load();
</script>
