<script>const SHEET_CSV='https://docs.google.com/spreadsheets/d/1P5kQZooTtNcgjEkMET-pqqmSkJQ9XWnnBxqIf3KAZXw/export?format=csv&gid=1202083824';

const C={unit:['unit induk'],upt:['upt','unit pelaksana'],ultg:['ultg'],gi:['gardu induk'],bay:['bay'],phasa:['phasa'],merk:['merk','merek'],type:['type','tipe'],date:['tanggal pemeliharaan terakhir','tanggal pemeliharaan','tanggal uji'],irAB:['hasil uji tahanan isolasi atas - bawah','hasil uji tahanan isolasi atas-bawah'],irAG:['hasil uji tahanan isolasi atas - ground','hasil uji tahanan isolasi atas-ground'],irBG:['hasil uji tahanan isolasi bawah - ground','hasil uji tahanan isolasi bawah-ground'],contactR:['pengujian tahanan kontak (mikro ohm) r'],contactS:['pengujian tahanan kontak (mikro ohm) s'],contactT:['pengujian tahanan kontak (mikro ohm) t'],closingR:['pengujian closing time (ms) r'],closingS:['pengujian closing time (ms) s'],closingT:['pengujian closing time (ms) t'],openingR:['pengujian opening time (ms) r'],openingS:['pengujian opening time (ms) s'],openingT:['pengujian opening time (ms) t'],purity:['pengujian sf6 purity'],dew:['pengujian sf6 dew point'],so2:['pengujian sf6 so2'],serial:['nomor seri','serial'],tech:['techident number','techidentno'],name:['bay']};

function createMulti(key){const box=$(key+'Box');boxes[key]=box;box.innerHTML=`<button type="button" class="multi-trigger"><span class="multi-trigger-label">Semua</span></button><div class="multi-menu"><input class="multi-search" placeholder="Ketik untuk mencari..."><div class="multi-actions"><button type="button" class="multi-action select-all">Pilih semua</button><button type="button" class="multi-action clear-all">Hapus</button></div><div class="multi-options"></div></div>`;const trigger=box.querySelector('.multi-trigger'),menu=box.querySelector('.multi-menu'),search=box.querySelector('.multi-search');trigger.onclick=()=>{document.querySelectorAll('.multi-menu.open').forEach(m=>{if(m!==menu)m.classList.remove('open')});document.querySelectorAll('.multi-trigger.open').forEach(b=>{if(b!==trigger)b.classList.remove('open')});menu.classList.toggle('open');trigger.classList.toggle('open');if(menu.classList.contains('open'))setTimeout(()=>search.focus(),0)};search.oninput=()=>renderMulti(key,uniqueBy(rowsForFilter(FILTERS.indexOf(key)),key));box.querySelector('.select-all').onclick=()=>{uniqueBy(rowsForFilter(FILTERS.indexOf(key)),key).forEach(v=>state[key].add(v));refreshFilters();apply()};box.querySelector('.clear-all').onclick=()=>{state[key].clear();refreshFilters();apply()}}

function updateYears(){let ys=raw.map(r=>year(val(r,'date'))).filter(Boolean),min=Math.min(...ys,2014),max=Math.max(...ys,new Date().getFullYear()),vals=[];for(let y=min;y<=max;y++)vals.push(String(y));fillSelect('fromYear',vals,$('fromYear').value||String(Math.max(min,max-4)));fillSelect('toYear',vals,$('toYear').value||String(max))}
function fillSelect(id,values,keep){const s=$(id);s.innerHTML=values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');if(values.includes(keep))s.value=keep;else s.value=values[0]||''}

function makeChart(id,title,unit,keys,colors){let el=$(id),labels=[...new Set(filtered.map(r=>year(val(r,'date'))).filter(Boolean))].sort((a,b)=>a-b);if(labels.length>5)labels=labels.slice(-5);let datasets=keys.map((k,i)=>({label:k.label,data:labels.map(y=>{let rows=filtered.filter(r=>year(val(r,'date'))===y),vs=rows.map(r=>num(val(r,k.key))).filter(v=>v!==null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null}),borderColor:colors[i],backgroundColor:colors[i],pointRadius:3,borderWidth:2,tension:.25,spanGaps:true}));let ctx=$(id).getContext('2d');charts.push(new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:7,font:{size:9}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y==null?'-':c.parsed.y.toLocaleString('id-ID',{maximumFractionDigits:3})}`}}},scales:{x:{grid:{color:'#e7edf4'},ticks:{font:{size:9}}},y:{grid:{color:'#e7edf4'},ticks:{font:{size:9},callback:v=>Number(v).toLocaleString('id-ID')}}}}}));$(id).parentElement.parentElement.querySelector('.chart-years').textContent=labels.length?`${labels.length} tahun`:'Tidak ada data'}

function renderCharts(){charts.forEach(c=>c.destroy());charts=[];let specs=[['irAB','IR Atas-Bawah','Mega Ohm',[{key:'irAB',label:'Atas-Bawah'}],['#1688f0']],['irAG','IR Atas-Ground','Mega Ohm',[{key:'irAG',label:'Atas-Ground'}],['#16a765']],['irBG','IR Bawah-Ground','Mega Ohm',[{key:'irBG',label:'Bawah-Ground'}],['#f29a00']],['contact','Tahanan Kontak','mikro Ohm (µΩ)',[{key:'contactR',label:'R'},{key:'contactS',label:'S'},{key:'contactT',label:'T'}],['#e53935','#f29a00','#1688f0']],['closing','Closing Time','ms',[{key:'closingR',label:'R'},{key:'closingS',label:'S'},{key:'closingT',label:'T'}],['#e53935','#f29a00','#1688f0']],['opening','Opening Time','ms',[{key:'openingR',label:'R'},{key:'openingS',label:'S'},{key:'openingT',label:'T'}],['#e53935','#f29a00','#1688f0']],['purity','SF6 Purity','%',[{key:'purity',label:'Purity'}],['#18a765']],['dew','SF6 Dew Point','°C',[{key:'dew',label:'Dew Point'}],['#6c45e8']],['so2','SF6 SO2','ppmV',[{key:'so2',label:'SO2'}],['#f07b00']]];$('charts').innerHTML=specs.map(s=>chartCard(s[0],s[1],s[2],s[3],s[4])).join('');specs.forEach(s=>makeChart(s[0],s[1],s[2],s[3],s[4]))}

function render(){renderCharts();detailRows();$('lastDate').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function exportCSV(){let head=detailCols.map(x=>x[0]).join(';'),body=filtered.map(r=>detailCols.map(([_,k])=>`"${String(val(r,k)||'').replaceAll('"','""')}"`).join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv'}));a.download='Trend_Inspection_PMT_Filtered.csv';a.click()}
async function load(){try{let r=await fetch(SHEET_CSV,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let t=await r.text();raw=parseCSV(t);if(!raw.length)throw Error('CSV kosong');resolveCols();FILTERS.forEach(createMulti);updateYears();refreshFilters();apply();$('status').className='status ok';$('status').textContent=`Data PMT berhasil dimuat • ${raw.length.toLocaleString('id-ID')} baris dari Google Sheet NORM AHI PMT`}catch(e){console.error(e);$('status').className='status error';$('status').textContent='Google Sheet belum dapat dibaca. Pastikan spreadsheet dapat diakses publik atau dipublikasikan sebagai CSV.';$('charts').innerHTML='<div class="empty" style="grid-column:1/-1">Data belum tersedia.</div>'}}
['fromYear','toYear'].forEach(id=>$(id).addEventListener('change',apply));$('search').addEventListener('input',()=>{page=1;detailRows()});$('prev').onclick=()=>{if(page>1){page--;detailRows()}};$('next').onclick=()=>{page++;detailRows()};$('resetBtn').onclick=()=>{FILTERS.forEach(k=>state[k].clear());updateYears();refreshFilters();apply();document.querySelectorAll('.multi-menu.open').forEach(m=>m.classList.remove('open'));document.querySelectorAll('.multi-trigger.open').forEach(b=>b.classList.remove('open'))};$('exportBtn').onclick=exportCSV;document.addEventListener('click',e=>{if(!e.target.closest('.multi-select'))document.querySelectorAll('.multi-menu.open').forEach(m=>m.classList.remove('open'))});load();
</script>
</body></html>
