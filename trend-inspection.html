<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#142b4a;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px}.app{display:flex;min-height:100vh}.sidebar{width:205px;background:#fff;border-right:1px solid #e3eaf2;position:fixed;left:0;top:0;bottom:0;padding:10px 8px;z-index:20}.logo{height:57px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #edf1f6;margin-bottom:7px;padding:4px 1px 10px;overflow:hidden}.logo img:first-child{width:70px;height:35px;object-fit:contain}.logo img:last-child{width:105px;height:34px;object-fit:contain}.nav a{display:block;padding:10px 12px;border-radius:8px;color:#24415f;text-decoration:none;margin:2px 0}.nav a.active{background:#e8f1fd;color:#0873d1;font-weight:700}.nav a:hover{background:#f2f7fc}.nav .trend{color:#0873d1;font-weight:700;background:#eaf3ff}.nav .sub{font-size:12px;padding-left:30px;margin-left:8px}.nav .sub.active-sub{background:#dcecff;color:#0873d1;font-weight:700}.side-date{position:absolute;bottom:18px;left:8px;right:8px;border:1px solid #dfe7ef;background:#f8fafc;border-radius:8px;padding:10px}.side-date small{display:block;color:#65758a}.side-date b{display:block;margin-top:3px}main{margin-left:205px;width:calc(100% - 205px);padding:10px 18px 28px}.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #dde6ef;padding-bottom:10px}.brand h1{margin:0;font-size:25px;letter-spacing:-.5px}.brand p{margin:4px 0 0;color:#60748c}.actions{display:flex;gap:8px;align-items:center}.date{border:1px solid #dbe4ee;background:#fff;border-radius:8px;padding:8px 12px;font-size:10px}.date b{display:block;font-size:11px;margin-top:2px}.btn{border:1px solid #0d77db;background:#fff;color:#066bc5;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:#0877d1;color:#fff}.status{display:none;border-radius:9px;padding:9px 12px;margin:10px 0;font-weight:700}.status.ok{display:block;color:#137a4a;background:#f4fbf7;border:1px solid #b7e2cc}.status.error{display:block;color:#b42318;background:#fff8f7;border:1px solid #f1b8b2}.filters{background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px;margin:10px 0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}.filter label{font-size:9px;font-weight:800;color:#53677e;display:block;margin-bottom:4px;text-transform:uppercase}.filter select{width:100%;height:32px;border:1px solid #d2ddea;border-radius:7px;background:#fff;color:#173452;padding:0 7px}.filter-actions{display:flex;gap:8px;align-items:end}.filter-actions button{height:32px}.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chart-card{background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px;min-width:0}.chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}.chart-title{font-weight:800;font-size:12px}.chart-unit{font-size:10px;color:#73839a;margin-top:3px}.chart-years{font-size:9px;color:#6881a0}.chart-box{height:205px;position:relative}.detail{margin-top:10px;background:#fff;border:1px solid #dce6f0;border-radius:10px;padding:10px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.detail-head h3{margin:0;font-size:14px}.detail-head small{color:#73839a}.detail-actions{display:flex;gap:8px}.search{width:270px;border:1px solid #d2ddea;border-radius:7px;padding:8px 10px}.table-wrap{max-height:430px;overflow:auto;border:1px solid #e6ebf2;border-radius:7px}.table-wrap table{border-collapse:separate;border-spacing:0;min-width:2100px;width:max-content;font-size:10px}.table-wrap th,.table-wrap td{padding:7px 8px;border-bottom:1px solid #edf1f5;border-right:1px solid #edf1f5;white-space:nowrap;background:#fff}.table-wrap th{position:sticky;top:0;background:#f7f9fc;z-index:5;color:#526079}.pager{display:flex;justify-content:flex-end;align-items:center;gap:7px;padding-top:8px}.pager button{padding:5px 10px;border:1px solid #d2ddea;background:#fff;border-radius:6px}.muted{color:#7b8798}.loading{padding:35px;text-align:center;color:#73839a}.empty{padding:35px;text-align:center;color:#73839a}.legend-note{font-size:9px;color:#75849a;margin-top:6px}@media(max-width:1100px){.sidebar{width:175px}main{margin-left:175px;width:calc(100% - 175px)}.chart-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto}.side-date{position:static;margin-top:10px}main{margin-left:0;width:100%}.app{display:block}.chart-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.header{gap:10px;flex-direction:column}.detail-head{align-items:stretch;flex-direction:column}.search{width:100%}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><img src="pln-logo.webp" alt="PLN"><img src="danantara.png" alt="Danantara"></div>
  <nav class="nav">
    <a href="index.html">Dashboard</a>

  </nav>
  <div class="side-date"><small>Sumber Data</small><b>Google Sheet • NORM AHI PMT</b></div>

<main>
<header class="header">
 <div class="brand"><h1>DASHBOARD AHI UIT JBB</h1><p>Trend Inspection – PMT</p></div>
 <div class="actions"><div class="date">Data Terakhir<b id="lastDate">Memuat...</b></div><button class="btn" id="resetBtn">↻ Reset Filter</button></div>
</header>
<div id="status" class="status"></div>
<section class="filters">
 <div class="filter"><label>Unit Induk</label><select id="unit"></select></div>
 <div class="filter"><label>UPT</label><select id="upt"></select></div>
 <div class="filter"><label>ULTG</label><select id="ultg"></select></div>
 <div class="filter"><label>GI</label><select id="gi"></select></div>
 <div class="filter"><label>Bay</label><select id="bay"></select></div>
 <div class="filter"><label>Phasa</label><select id="phasa"></select></div>
 <div class="filter"><label>Merk</label><select id="merk"></select></div>
 <div class="filter"><label>Type</label><select id="type"></select></div>
 <div class="filter"><label>From Year</label><select id="fromYear"></select></div>
 <div class="filter"><label>To Year</label><select id="toYear"></select></div>
</section>
<section class="chart-grid" id="charts"><div class="loading" style="grid-column:1/-1">Membaca data PMT...</div></section>
<section class="detail">
 <div class="detail-head"><div><h3>Detail Pengujian PMT</h3><small id="count">Menampilkan 0 data</small></div><div class="detail-actions"><input class="search" id="search" placeholder="Search GI / Bay / Nama Aset..."><button class="btn" id="exportBtn">⇩ Export CSV</button></div></div>
 <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
 <div class="pager"><span class="muted" id="pageInfo"></span><button id="prev">‹</button><button id="next">›</button></div>
</section>
</main></div>
<script>
const SHEET_CSV='https://docs.google.com/spreadsheets/d/1P5kQZooTtNcgjEkMET-pqqmSkJQ9XWnnBxqIf3KAZXw/export?format=csv&gid=1202083824';
const PAGE_SIZE=10;let raw=[],filtered=[],page=1,charts=[];
const $=id=>document.getElementById(id);
function norm(s){return String(s??'').normalize('NFKC').replace(/\u00a0/g,' ').replace(/[–—−]/g,'-').replace(/\s+/g,' ').trim().toLowerCase()}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false,delim=(t.split(/\r?\n/).find(Boolean)||'').split(';').length>(t.split(/\r?\n/).find(Boolean)||'').split(',').length?';':',';for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===delim&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}if(!rows.length)return[];let headers=rows.shift().map(x=>x.trim());return rows.map(a=>Object.fromEntries(headers.map((h,i)=>[h,(a[i]??'').trim()])))}
function headers(){return Object.keys(raw[0]||{})}
function findCol(candidates){let hs=headers();for(const c of candidates){let n=norm(c);let exact=hs.find(h=>norm(h)===n);if(exact)return exact}for(const c of candidates){let n=norm(c);let hit=hs.find(h=>norm(h).includes(n));if(hit)return hit}return ''}
function findAll(patterns){let hs=headers();return hs.filter(h=>patterns.some(p=>norm(h).includes(norm(p))))}
const C={unit:['unit induk'],upt:['upt','unit pelaksana'],ultg:['ultg'],gi:['gardu induk'],bay:['bay'],phasa:['phasa'],merk:['merk','merek'],type:['type','tipe'],date:['tanggal pemeliharaan terakhir','tanggal pemeliharaan','tanggal uji'],irAB:['hasil uji tahanan isolasi atas - bawah','hasil uji tahanan isolasi atas-bawah'],irAG:['hasil uji tahanan isolasi atas - ground','hasil uji tahanan isolasi atas-ground'],irBG:['hasil uji tahanan isolasi bawah - ground','hasil uji tahanan isolasi bawah-ground'],contactR:['pengujian tahanan kontak (mikro ohm) r'],contactS:['pengujian tahanan kontak (mikro ohm) s'],contactT:['pengujian tahanan kontak (mikro ohm) t'],closingR:['pengujian closing time (ms) r'],closingS:['pengujian closing time (ms) s'],closingT:['pengujian closing time (ms) t'],openingR:['pengujian opening time (ms) r'],openingS:['pengujian opening time (ms) s'],openingT:['pengujian opening time (ms) t'],purity:['pengujian sf6 purity'],dew:['pengujian sf6 dew point'],so2:['pengujian sf6 so2'],serial:['nomor seri','serial'],tech:['techident number','techidentno'],name:['bay']};
let COL={};
function resolveCols(){for(const k in C)COL[k]=findCol(C[k]);}
function val(r,k){let h=COL[k];return h?r[h]:''}
function num(v){let s=String(v??'').trim();if(!s)return null;s=s.replace(/\s/g,'');if(s.includes('.')&&s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(s.includes(',')&&!s.includes('.')){s=s.replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}let m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function year(v){let s=String(v||'');let m=s.match(/(20\d{2})/);return m?+m[1]:null}
function uniqueBy(rows,k){return [...new Set(rows.map(r=>val(r,k)).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'id'))}
function fill(id,values,keep){let s=$(id),old=keep??s.value;s.innerHTML='<option value="">Semua</option>'+values.map(v=>`<option>${escapeHtml(v)}</option>`).join('');if(values.includes(old))s.value=old}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function baseFiltered(stop){let f=raw.slice();const ids=['unit','upt','ultg','gi','bay','phasa','merk','type'];for(const id of ids){if(id===stop)break;let v=$(id).value;if(v)f=f.filter(r=>val(r,id=== 'type'?'type':id)===v)}return f}
function refreshFilters(changed){let order=['unit','upt','ultg','gi','bay','phasa','merk','type'];let current={};order.forEach(id=>current[id]=$(id).value);for(let i=0;i<order.length;i++){let id=order[i],f=raw.slice();for(let j=0;j<i;j++){let v=current[order[j]];if(v)f=f.filter(r=>val(r,order[j])===v)}fill(id,uniqueBy(f,id),current[id])}updateYears();}
function updateYears(){let ys=raw.map(r=>year(val(r,'date'))).filter(Boolean);let min=Math.min(...ys,2014),max=Math.max(...ys,new Date().getFullYear());let vals=[];for(let y=min;y<=max;y++)vals.push(String(y));fill('fromYear',vals,$('fromYear').value);fill('toYear',vals,$('toYear').value);if(!$('fromYear').value)$('fromYear').value=String(Math.max(min,max-12));if(!$('toYear').value)$('toYear').value=String(max)}
function apply(){let f=raw.slice();const ids=['unit','upt','ultg','gi','bay','phasa','merk','type'];ids.forEach(id=>{let v=$(id).value;if(v)f=f.filter(r=>val(r,id)===v)});let fy=+$('fromYear').value,ty=+$('toYear').value;if(fy)f=f.filter(r=>(year(val(r,'date'))||0)>=fy);if(ty)f=f.filter(r=>(year(val(r,'date'))||0)<=ty);filtered=f;page=1;render()}
function makeChart(id,title,unit,keys,colors){
let el=$(id);
let labels=[...new Set(filtered.map(r=>year(val(r,'date'))).filter(Boolean))].sort((a,b)=>a-b);
if(labels.length>5)labels=labels.slice(-5);
const phaseCharts=['irAB','irAG','irBG','purity','dew','so2'];
let datasets;
if(phaseCharts.includes(id)){
 const phases=['R','S','T'];
 datasets=phases.map((ph,i)=>({
  label:ph,
  data:labels.map(y=>{
   let rows=filtered.filter(r=>year(val(r,'date'))===y && norm(val(r,'phasa'))===ph.toLowerCase());
   let vs=rows.map(r=>num(val(r,keys[0].key))).filter(v=>v!==null);
   return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null
  }),
  borderColor:colors[i],backgroundColor:colors[i],pointRadius:3,borderWidth:2,tension:.25,spanGaps:true
 }));
}else{
 datasets=keys.map((k,i)=>({
  label:k.label,
  data:labels.map(y=>{
   let rows=filtered.filter(r=>year(val(r,'date'))===y);
   let vs=rows.map(r=>num(val(r,k.key))).filter(v=>v!==null);
   return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null
  }),
  borderColor:colors[i],backgroundColor:colors[i],pointRadius:3,borderWidth:2,tension:.25,spanGaps:true
 }));
}
let ctx=$(id).getContext('2d');
charts.push(new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:7,font:{size:9}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y==null?'-':c.parsed.y.toLocaleString('id-ID',{maximumFractionDigits:3})}`}}},scales:{x:{grid:{color:'#e7edf4'},ticks:{font:{size:9}}},y:{grid:{color:'#e7edf4'},ticks:{font:{size:9},callback:v=>Number(v).toLocaleString('id-ID')}}}}}));
$(id).parentElement.parentElement.querySelector('.chart-years').textContent=labels.length?`${labels.length} tahun`:'Tidak ada data'
}function chartCard(id,title,unit,keys,colors){return `<div class="chart-card"><div class="chart-head"><div><div class="chart-title">${title}</div><div class="chart-unit">${unit}</div></div><div class="chart-years">5 tahun</div></div><div class="chart-box"><canvas id="${id}"></canvas></div></div>`}
function renderCharts(){charts.forEach(c=>c.destroy());charts=[];let specs=[['irAB','IR Atas-Bawah','Mega Ohm',[{key:'irAB',label:'IR'}],['#e53935','#1688f0','#16a765']],['irAG','IR Atas-Ground','Mega Ohm',[{key:'irAG',label:'IR'}],['#e53935','#1688f0','#16a765']],['irBG','IR Bawah-Ground','Mega Ohm',[{key:'irBG',label:'IR'}],['#e53935','#1688f0','#16a765']],['contact','Tahanan Kontak','mikro Ohm (µΩ)',[{key:'contactR',label:'R'},{key:'contactS',label:'S'},{key:'contactT',label:'T'}],['#e53935','#f29a00','#1688f0']],['closing','Closing Time','ms',[{key:'closingR',label:'R'},{key:'closingS',label:'S'},{key:'closingT',label:'T'}],['#e53935','#f29a00','#1688f0']],['opening','Opening Time','ms',[{key:'openingR',label:'R'},{key:'openingS',label:'S'},{key:'openingT',label:'T'}],['#e53935','#f29a00','#1688f0']],['purity','SF6 Purity','%',[{key:'purity',label:'Purity'}],['#e53935','#1688f0','#16a765']],['dew','SF6 Dew Point','°C',[{key:'dew',label:'Dew Point'}],['#e53935','#1688f0','#16a765']],['so2','SF6 SO2','ppmV',[{key:'so2',label:'SO2'}],['#e53935','#1688f0','#16a765']]];$('charts').innerHTML=specs.map(s=>chartCard(s[0],s[1],s[2],s[3],s[4])).join('');specs.forEach(s=>makeChart(s[0],s[1],s[2],s[3],s[4]))}
const detailCols=[['UNIT INDUK','unit'],['UPT','upt'],['ULTG','ultg'],['GARDU INDUK','gi'],['BAY','bay'],['PHASA','phasa'],['MERK','merk'],['TYPE','type'],['NOMOR SERI','serial'],['TAHUN','date'],['IR ATAS-BAWAH','irAB'],['IR ATAS-GROUND','irAG'],['IR BAWAH-GROUND','irBG'],['KONTAK R','contactR'],['KONTAK S','contactS'],['KONTAK T','contactT'],['CLOSING R','closingR'],['CLOSING S','closingS'],['CLOSING T','closingT'],['OPENING R','openingR'],['OPENING S','openingS'],['OPENING T','openingT'],['SF6 PURITY','purity'],['SF6 DEW POINT','dew'],['SF6 SO2','so2'],['TANGGAL UJI','date']];
function detailRows(){let q=norm($('search').value);let rows=filtered.filter(r=>!q||detailCols.some(([_,k])=>norm(val(r,k)).includes(q)));let pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));if(page>pages)page=pages;let view=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);$('count').textContent=`Menampilkan ${rows.length.toLocaleString('id-ID')} data`;$('pageInfo').textContent=`Halaman ${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('thead').innerHTML='<tr>'+detailCols.map(x=>`<th>${x[0]}</th>`).join('')+'</tr>';$('tbody').innerHTML=view.length?view.map(r=>'<tr>'+detailCols.map(([_,k])=>`<td>${escapeHtml(k==='date'?val(r,k):val(r,k))}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${detailCols.length}" class="empty">Tidak ada data sesuai filter.</td></tr>`;}
function render(){renderCharts();detailRows();$('lastDate').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function exportCSV(){let head=detailCols.map(x=>x[0]).join(';');let body=filtered.map(r=>detailCols.map(([_,k])=>`"${String(val(r,k)||'').replaceAll('"','""')}"`).join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv'}));a.download='Trend_Inspection_PMT_Filtered.csv';a.click()}
async function load(){try{let r=await fetch(SHEET_CSV,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let t=await r.text();raw=parseCSV(t);if(!raw.length)throw Error('CSV kosong');resolveCols();populateAll();$('status').className='status ok';$('status').textContent=`Data PMT berhasil dimuat • ${raw.length.toLocaleString('id-ID')} baris dari Google Sheet NORM AHI PMT`;apply()}catch(e){console.error(e);$('status').className='status error';$('status').textContent='Google Sheet belum dapat dibaca. Pastikan spreadsheet dapat diakses publik atau dipublikasikan sebagai CSV.';$('charts').innerHTML='<div class="empty" style="grid-column:1/-1">Data belum tersedia.</div>';}}
function populateAll(){refreshFilters();updateYears();}
['unit','upt','ultg','gi','bay','phasa','merk','type'].forEach(id=>$(id).addEventListener('change',()=>{refreshFilters(id);apply()}));['fromYear','toYear'].forEach(id=>$(id).addEventListener('change',apply));$('search').addEventListener('input',()=>{page=1;detailRows()});$('prev').onclick=()=>{if(page>1){page--;detailRows()}};$('next').onclick=()=>{page++;detailRows()};$('resetBtn').onclick=()=>{['unit','upt','ultg','gi','bay','phasa','merk','type'].forEach(id=>$(id).value='');updateYears();apply()};$('exportBtn').onclick=exportCSV;load();
</script>
</body></html>
